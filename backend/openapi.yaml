openapi: 3.1.0
info:
  title: Library API
  description: "Backend API for a library app. Authentication is cookie-based: on login/signup an HTTP-only `libraryApiAccessToken` cookie is set; protected routes require it."
  version: 1.1.0
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      operationId: getHello
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!

  /auth/login:
    post:
      summary: Log in an existing user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDto'
      responses:
        '200':
          description: OK, auth cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets `libraryApiAccessToken` and `libraryApiRefreshToken` HTTP-only cookies
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: Incorrect login or password

  /auth/signup:
    post:
      summary: Register a new user
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDto'
      responses:
        '200':
          description: OK, auth cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets `libraryApiAccessToken` and `libraryApiRefreshToken` HTTP-only cookies
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          description: User with this login already exists

  /auth/refresh:
    post:
      summary: Refresh the access token using the refresh token cookie
      operationId: refresh
      responses:
        '200':
          description: Access token refreshed, cookies updated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets a new `libraryApiAccessToken` HTTP-only cookie
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '401':
          description: Missing or invalid refresh token

  /books:
    get:
      summary: Search books
      description: Searches Open Library and returns a page of books. Results are cached.
      operationId: findManyBooks
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          required: false
          schema:
            type: string
            description: Free-text search query
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '400':
          description: Bad data format from upstream API

  /books/random:
    get:
      summary: Get a random page of books
      operationId: findRandomBooks
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: A random page of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '400':
          description: Bad data format from upstream API

  /books/{olid}:
    get:
      summary: Get a single book by Open Library ID
      operationId: findOneBook
      parameters:
        - name: olid
          in: path
          required: true
          schema:
            type: string
            example: OL45804W
      responses:
        '200':
          description: Detailed book information including the user's liked state and total like count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedBook'

  /comments:
    post:
      summary: Add a comment to a book
      operationId: addComment
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentDto'
      responses:
        '201':
          description: Comment created
        '401':
          description: Unauthorized

    get:
      summary: Get comments for a book
      operationId: getCommentsByBook
      parameters:
        - name: olid
          in: query
          required: true
          schema:
            type: string
            description: Open Library key of the book
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of comments for the book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComments'

    put:
      summary: Update a comment
      description: Allows the comment author to change the text of their comment.
      operationId: updateComment
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentUpdateDto'
      responses:
        '200':
          description: Comment updated
        '400':
          description: Comment not found or access denied
        '401':
          description: Unauthorized

  /comments/mine:
    get:
      summary: Get the current user's comments
      operationId: getMyComments
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of the current user's comments, each with the book title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserHistoryComments'
        '401':
          description: Unauthorized

  /comments/{id}:
    delete:
      summary: Delete a comment
      description: Allows the comment author to delete their own comment.
      operationId: deleteComment
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comment deleted
        '400':
          description: Comment not found or access denied
        '401':
          description: Unauthorized

  /book-list:
    get:
      summary: Get the current user's book list
      description: Optionally filtered by status and paginated.
      operationId: getBookList
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookListStatusWithAll'
        - name: page
          in: query
          required: true
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                enum:
                  - All
      responses:
        '200':
          description: A page of books from the user's list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          description: Unauthorized

    post:
      summary: Add a book to the current user's list
      operationId: addBookToList
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookListItemDto'
      responses:
        '201':
          description: Book added to list
        '401':
          description: Unauthorized

  /likes:
    post:
      summary: Toggle a like on a book
      operationId: toggleLike
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LikeDto'
      responses:
        '201':
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '401':
          description: Unauthorized

    get:
      summary: Get the current user's liked books
      operationId: getLikedBooks
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                enum:
                  - All
      responses:
        '200':
          description: A page of liked books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          description: Unauthorized

  /likes/sse/{olid}:
    get:
      summary: Subscribe to like-count updates via Server-Sent Events
      operationId: streamLikes
      parameters:
        - name: olid
          in: path
          required: true
          schema:
            type: string
            description: Open Library key of the book to watch
      responses:
        '200':
          description: SSE stream of like count changes. Also sends periodic `ping` heartbeat events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LikeEvent'

  /mixed-list:
    get:
      summary: Get the user's combined book list and liked books
      description: Merges the user's book list with their liked books, optionally filtered by list status, liked state and a free-text query.
      operationId: getMixedList
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookListStatusWithAll'
        - name: query
          in: query
          required: false
          schema:
            type: string
            description: Free-text query matching book title or authors
        - name: liked
          in: query
          required: false
          schema:
            type: boolean
            description: Filter by liked state
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          description: Unauthorized

  /user/login:
    get:
      summary: Get the current user's login
      operationId: getUserLogin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The user's login
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized

    post:
      summary: Change the current user's login
      operationId: changeLogin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: Login changed
        '400':
          description: User with this login already exists
        '401':
          description: Unauthorized

  /user/password:
    post:
      summary: Change the current user's password
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordDto'
      responses:
        '201':
          description: Password changed
        '400':
          description: Current password does not match
        '401':
          description: Unauthorized

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: libraryApiAccessToken
      description: HTTP-only access token cookie set on login/signup/refresh.

  schemas:
    AuthDto:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
        password:
          type: string

    Book:
      type: object
      required:
        - olid
        - title
        - authors
        - coversUrl
        - liked
      properties:
        olid:
          type: string
          description: Open Library key
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        coversUrl:
          type: string
          nullable: true
          description: Open Library cover URL
        liked:
          type: boolean
          description: Whether the current user has liked the book. Always false when no auth cookie is sent.

    ExtendedBook:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          required:
            - description
            - likes
          properties:
            description:
              type: string
            likes:
              type: integer
              description: Total number of likes for the book

    PaginatedBooks:
      type: object
      required:
        - items
        - pageCount
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        pageCount:
          type: integer
          description: Total number of pages
        total:
          type: integer
          description: Total number of matching results

    CommentDto:
      type: object
      required:
        - bookOlid
        - text
      properties:
        bookOlid:
          type: string
          description: Open Library key of the book
        text:
          type: string

    CommentUpdateDto:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: integer
        text:
          type: string

    Comment:
      type: object
      required:
        - id
        - bookOlid
        - login
        - text
        - mine
        - updatedAt
      properties:
        id:
          type: integer
        bookOlid:
          type: string
        login:
          type: string
          description: Login of the comment author
        text:
          type: string
        mine:
          type: boolean
          description: Whether the comment belongs to the current user. Always false when no auth cookie is sent.
        updatedAt:
          type: string
          format: date-time

    UserHistoryComment:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          required:
            - bookTitle
          properties:
            bookTitle:
              type: string

    PaginatedComments:
      type: object
      required:
        - items
        - pageCount
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pageCount:
          type: integer
        total:
          type: integer

    PaginatedUserHistoryComments:
      type: object
      required:
        - items
        - pageCount
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserHistoryComment'
        pageCount:
          type: integer
        total:
          type: integer

    BookListItemDto:
      type: object
      required:
        - bookOlid
        - status
      properties:
        bookOlid:
          type: string
        status:
          $ref: '#/components/schemas/BookListStatus'

    BookListStatus:
      type: string
      enum:
        - Want to read
        - Currently reading
        - Already read

    BookListStatusWithAll:
      type: string
      enum:
        - All
        - Want to read
        - Currently reading
        - Already read

    LikeDto:
      type: object
      required:
        - bookOlid
      properties:
        bookOlid:
          type: string

    Like:
      type: object
      required:
        - id
        - bookOlid
      properties:
        id:
          type: integer
        bookOlid:
          type: string
        user:
          $ref: '#/components/schemas/User'

    LikeEvent:
      type: object
      required:
        - bookOlid
        - likes
      properties:
        bookOlid:
          type: string
        likes:
          type: integer
          description: Number of likes for the book

    LoginDto:
      type: object
      required:
        - newLogin
      properties:
        newLogin:
          type: string

    PasswordDto:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required:
        - id
        - login
        - createdAt
      properties:
        id:
          type: integer
        login:
          type: string
        hashedPassword:
          type: string
          description: Never exposed in responses
        createdAt:
          type: string
          format: date-time